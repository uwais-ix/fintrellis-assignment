spring:
  application:
    name: fintrellis-journal
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:55432/journal}
    username: ${DATABASE_USERNAME:journal}
    password: ${DATABASE_PASSWORD:journal-local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER:http://localhost:8180/realms/journal}
          jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:8180/realms/journal/protocol/openid-connect/certs}
          audiences: journal-api

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [%X{requestId}]"
