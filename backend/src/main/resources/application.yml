spring:
  application:
    name: fintrellis-journal
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:55432/journal}
    username: ${DATABASE_USERNAME:journal}
    password: ${DATABASE_PASSWORD:journal-local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
