name: fintrellis-journal

services:
  postgres:
    image: postgres:18.1-alpine
    environment:
      POSTGRES_DB: journal
      POSTGRES_USER: journal
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-journal-local}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U journal -d journal"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: local-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-keycloak-local}
      KC_HOSTNAME: http://localhost:8180
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:8180:8080"
    volumes:
      - ./infra/keycloak/journal-realm.json:/opt/keycloak/data/import/journal-realm.json:ro
      - keycloak-data:/opt/keycloak/data
    healthcheck:
      test:
        - CMD
        - /bin/bash
        - -ec
        - "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3; grep -q '200 OK' <&3"
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/journal
      DATABASE_USERNAME: journal
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-journal-local}
      OIDC_ISSUER: http://localhost:8180/realms/journal
      OIDC_JWK_SET_URI: http://keycloak:8080/realms/journal/protocol/openid-connect/certs
      SPRING_PROFILES_ACTIVE: demo
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_OIDC_AUTHORITY: http://localhost:8180/realms/journal
        VITE_OIDC_CLIENT_ID: journal-web
        VITE_OIDC_REDIRECT_URI: http://localhost:8088/auth/callback
        VITE_OIDC_POST_LOGOUT_REDIRECT_URI: http://localhost:8088/
    ports:
      - "127.0.0.1:8088:8080"
    depends_on:
      - backend

  sonar-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sonar
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:-sonar-local}
    volumes:
      - sonar-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonar"]
      interval: 5s
      timeout: 3s
      retries: 20
    profiles: ["quality"]

  sonarqube:
    image: sonarqube:26.11.0.134175-community
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:-sonar-local}
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - sonar-data:/opt/sonarqube/data
      - sonar-extensions:/opt/sonarqube/extensions
      - sonar-logs:/opt/sonarqube/logs
    depends_on:
      sonar-db:
        condition: service_healthy
    profiles: ["quality"]

volumes:
  postgres-data:
  keycloak-data:
  sonar-db-data:
  sonar-data:
  sonar-extensions:
  sonar-logs:
